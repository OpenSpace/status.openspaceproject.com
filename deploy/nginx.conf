# Configuration for serving the built page (the contents of `dist`) with nginx. Include it
# in the `server` block of status.openspaceproject.com, for example with
#   include /path/to/deploy/nginx.conf;

root /var/www/status.openspaceproject.com/html;
index index.html;

# The build writes a gzip (.gz) and a brotli (.br) compressed copy of every text file, so
# nginx can send those directly instead of compressing the files on every request.
# `brotli_static` requires the ngx_brotli module; remove the line if it is not installed
gzip_static on;
brotli_static on;

# All files in `assets` have a content hash in their name and never change, so browsers
# can keep them forever
location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}

# The page itself has to be revalidated on every visit so that a new deployment, which
# references new asset names, is picked up immediately
location = /index.html {
  add_header Cache-Control "no-cache";
}

location / {
  add_header Cache-Control "no-cache";
  try_files $uri $uri/ =404;
}
