# Apache httpd configuration for status.openspaceproject.com. Include it inside the
# <VirtualHost> block of the site, for example with
#   Include /path/to/deploy/httpd.conf
#
# Requires mod_headers and mod_deflate

# places.json is loaded cross-origin by the impact map on www.openspaceproject.com
# (assets/js/impact-map.js in the www.openspaceproject.com repository). It is regenerated
# on every build under the same name, so browsers have to revalidate it. Files from
# `public` are not precompressed by the build, so it is compressed on the fly instead
<Location "/places.json">
  Header set Access-Control-Allow-Origin "*"
  Header set Cache-Control "no-cache"
  AddOutputFilterByType DEFLATE application/json
</Location>
